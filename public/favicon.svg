<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bearBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="innerEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="muzzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E3A8A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Bear Background Glow / Base Group -->
  <g filter="url(#softShadow)">
    <!-- Left Ear -->
    <circle cx="16" cy="16" r="9" fill="url(#bearBody)" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="url(#innerEar)" />

    <!-- Right Ear -->
    <circle cx="48" cy="16" r="9" fill="url(#bearBody)" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="48" cy="16" r="5" fill="url(#innerEar)" />

    <!-- Head -->
    <ellipse cx="32" cy="34" rx="22" ry="19" fill="url(#bearBody)" stroke="#2563EB" stroke-width="1.5" />

    <!-- Cute Tuft of Fur on Forehead -->
    <path d="M 30 15 Q 32 10 34 15 Q 36 11 37 16" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" />

    <!-- Snout / Muzzle -->
    <ellipse cx="32" cy="38" rx="10" ry="7.5" fill="url(#muzzleGrad)" stroke="#60A5FA" stroke-width="1" />

    <!-- Nose -->
    <path d="M 29 34.5 C 29 33.5, 35 33.5, 35 34.5 C 35 36.5, 33 37.5, 32 37.5 C 31 37.5, 29 36.5, 29 34.5 Z" fill="#1E3A8A" />

    <!-- Mouth -->
    <path d="M 32 37.5 L 32 41 M 32 41 Q 29 43.5 27 41.5 M 32 41 Q 35 43.5 37 41.5" fill="none" stroke="#1E3A8A" stroke-width="1.3" stroke-linecap="round" />

    <!-- Left Eye -->
    <ellipse cx="23" cy="30" rx="3" ry="3.5" fill="#1E3A8A" />
    <circle cx="21.8" cy="28.8" r="1.2" fill="#FFFFFF" />
    <circle cx="24.2" cy="31.5" r="0.6" fill="#FFFFFF" />

    <!-- Right Eye -->
    <ellipse cx="41" cy="30" rx="3" ry="3.5" fill="#1E3A8A" />
    <circle cx="39.8" cy="28.8" r="1.2" fill="#FFFFFF" />
    <circle cx="42.2" cy="31.5" r="0.6" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <ellipse cx="16.5" cy="36" rx="3.8" ry="2.2" fill="#F472B6" opacity="0.6" />
    <ellipse cx="47.5" cy="36" rx="3.8" ry="2.2" fill="#F472B6" opacity="0.6" />
  </g>
</svg>
