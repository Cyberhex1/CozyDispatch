# Keeps the catalog (every two weeks) and news (daily) fresh by writing straight to the production D1
# database. Needs three repository secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   (token with "D1 Edit" permission)
#   CLOUDFLARE_ACCOUNT_ID
#   D1_DATABASE_ID         (e8574478-bf2c-4d1c-9873-e83ad3408abe)
name: Sync games and news

on:
  schedule:
    # D1's free plan allows 100,000 rows written per day, so the 7,000-game
    # catalog is checked every two weeks (1st and 15th); news updates once a day.
    - cron: '17 5 1,15 * *'   # catalog + news, every two weeks
    - cron: '47 6 * * *'      # news only, once a day
  workflow_dispatch:
    inputs:
      target:
        description: 'What to sync'
        type: choice
        options: [all, catalog, news]
        default: all

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then
            if [ "${{ github.event.schedule }}" = "17 5 1,15 * *" ]; then TARGET=all; else TARGET=news; fi
          fi
          npx tsx scripts/sync.ts --remote --target="$TARGET"
