<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cozy Dispatch — Cozy &amp; indie PC games, updated daily</title>
    <meta name="description" content="A daily guide to cozy and indie games on Steam: new releases, deals, Steam Deck status, developer updates and news, refreshed from Steam every few hours." />
    <meta property="og:title" content="Cozy Dispatch" />
    <meta property="og:description" content="Cozy and indie PC games, updated daily from Steam." />
    <meta name="theme-color" content="#FBF8F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16150F" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://shared.akamai.steamstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('cd_theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
